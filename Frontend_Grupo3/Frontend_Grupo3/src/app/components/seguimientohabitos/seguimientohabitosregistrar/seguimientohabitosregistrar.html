<div class="container">
    <h2>{{ edicion ? 'Actualizar Seguimiento' : 'Registrar Seguimiento' }}</h2>

    <div class="form-box">
        <form [formGroup]="form" (submit)="aceptar()">

            @if (edicion) {
            <mat-form-field>
                <mat-label>ID</mat-label>
                <input matInput formControlName="codigo" readonly />
            </mat-form-field>
            }

            <mat-form-field appearance="fill">
                <mat-label>Fecha</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="fechaSeguimiento" placeholder="MM/DD/YYYY" />

                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>

                <mat-error>
                    @if (form.get('fechaSeguimiento')?.hasError('required')) {
                    La fecha es obligatoria.
                    }
                </mat-error>
            </mat-form-field>


            <mat-form-field>
                <mat-label>Completado</mat-label>
                <mat-select formControlName="completado">
                    <mat-option [value]="true">Sí</mat-option>
                    <mat-option [value]="false">No</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Calidad (0-10)</mat-label>
                <input matInput type="number" formControlName="calidadEjecucion" min="0" max="10"
                    (input)="limitarCalidad($event)" />
            </mat-form-field>

            <mat-form-field>
                <mat-label>Notas</mat-label>
                <textarea matInput formControlName="notas" maxlength="200"></textarea>
                <mat-hint align="end">{{ form.value.notas?.length || 0 }}/200</mat-hint>
            </mat-form-field>

            <div class="button-container">
                <button matButton="elevated">
                    {{ edicion ? 'Actualizar' : 'Registrar' }}
                </button>

                <button mat-button type="button" class="cancel-btn" (click)="cancelar()">
                    Cancelar
                </button>
            </div>

        </form>
    </div>
</div>
