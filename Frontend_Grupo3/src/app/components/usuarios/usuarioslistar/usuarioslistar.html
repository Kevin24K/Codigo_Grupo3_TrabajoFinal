<div class="container">

    <div class="header-row">
        <h2>
            <mat-icon class="music-icon">person</mat-icon>
            Gestión de Usuarios
        </h2>
        <button mat-button class="add" [routerLink]="['/usuarios/news']">
            <mat-icon>add</mat-icon> Registrar nuevo usuario
        </button>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Codigo</th>
            <td mat-cell *matCellDef="let element">{{ element.id}} </td>
        </ng-container>


        <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef>Nombre de usuario</th>
            <td mat-cell *matCellDef="let element">
                {{ element.username }}
            </td>
        </ng-container>

        <!-- 
        <ng-container matColumnDef="password">
            <th mat-header-cell *matHeaderCellDef>Contraseña</th>
            <td mat-cell *matCellDef="let element">
                {{ element.password }}
            </td>
        </ng-container>

        <ng-container matColumnDef="enabled">
            <th mat-header-cell *matHeaderCellDef>Activado</th>
            <td mat-cell *matCellDef="let element">
                <mat-icon [ngClass]="element.completado ? 'completed' : 'not-completed'">
                    {{ element.enabled ? 'check_circle' : 'cancel' }}
                </mat-icon>
            </td>
        </ng-container>
        -->

        <ng-container matColumnDef="editar">
            <th mat-header-cell *matHeaderCellDef>Editar</th>
            <td mat-cell *matCellDef="let element">
                <button mat-button [routerLink]="['/usuarios/edits', element.id]">
                    <mat-icon>edit</mat-icon>
                </button>
            </td>
        </ng-container>


        <ng-container matColumnDef="eliminar">
            <th mat-header-cell *matHeaderCellDef>Eliminar</th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="warn" (click)="eliminar(element.id)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
</div>
