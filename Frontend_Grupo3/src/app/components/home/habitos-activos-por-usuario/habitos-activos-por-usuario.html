<div class="container">
    <h2>
        <mat-icon class="report-icon">analytics</mat-icon>
        Reporte: Hábitos Activos por Usuario
    </h2>

    <div class="search-box">
        <form [formGroup]="form" (ngSubmit)="buscarHabitos()">
            <mat-form-field appearance="fill" class="input-full-width">
                <mat-label>ID de Usuario</mat-label>
                <input matInput type="number" formControlName="idUsuario" placeholder="Ej: 1" min="1">
                <mat-error *ngIf="form.get('idUsuario')?.hasError('required')">
                    El ID de usuario es obligatorio.
                </mat-error>
                <mat-error *ngIf="form.get('idUsuario')?.hasError('min')">
                    El ID debe ser un número positivo.
                </mat-error>
            </mat-form-field>

            <button mat-raised-button type="submit" [disabled]="form.invalid">
                <mat-icon>search</mat-icon> Buscar
            </button>
        </form>
    </div>

    <div class="results-box">
        <p class="message" [class.error]="!dataSource.data.length && form.get('idUsuario')?.valid">{{ mensaje }}</p>

        <div class="table-responsive" *ngIf="dataSource.data.length > 0">
            <mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                <ng-container matColumnDef="nombreHabito">
                    <mat-header-cell *matHeaderCellDef> Hábito </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.nombreHabito}} </mat-cell>
                </ng-container>

                <ng-container matColumnDef="nombreUsuario">
                    <mat-header-cell *matHeaderCellDef> Usuario </mat-header-cell>
                    <mat-cell *matCellDef="let element"> {{element.nombreUsuario}} </mat-cell>
                </ng-container>

                <mat-header-row *matHeaderRowDef="columnas"></mat-header-row>
                <mat-row *matRowDef="let row; columns: columnas;"></mat-row>
            </mat-table>
        </div>
    </div>
</div>
