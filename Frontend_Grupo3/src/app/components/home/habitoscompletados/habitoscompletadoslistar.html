<div class="report-container">
  <h2>
    <mat-icon>done_all</mat-icon>Reporte de Hábitos Completados por Usuario
  </h2>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource" class="custom-table">
      
      <ng-container matColumnDef="nombreHabito">
        <th mat-header-cell *matHeaderCellDef>Nombre del Hábito</th>
        <td mat-cell *matCellDef="let element">
          {{ element.nombreHabito }}
        </td>
      </ng-container>

      <ng-container matColumnDef="nombreUsuario">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let element">
          {{ element.nombreUsuario }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <div *ngIf="dataSource.data.length === 0" class="no-data-message">
      <mat-icon>info</mat-icon> No se encontraron hábitos completados registrados.
    </div>
  </div>
</div>
