<div class="container">

  <h2 class="title">Objetivos alcanzados por usuario</h2>

  <!-- Buscador -->
  <div class="search-box">
    <mat-form-field appearance="outline">
      <mat-label>Buscar usuario</mat-label>
      <input
        matInput
        [(ngModel)]="searchTerm"
        (input)="applyFilter()"
        placeholder="Ej: Carlos"
      />
    </mat-form-field>

    <button class="clear-btn" mat-icon-button (click)="clearSearch()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Gráfico -->
  <div class="chart-container" *ngIf="hasData; else noData">
    <canvas
      baseChart
      [data]="chartData"
      [options]="barChartOptions"
      [legend]="barChartLegend"
      [type]="barChartType">
    </canvas>
  </div>

  <ng-template #noData>
    <p class="no-data">No se encontraron resultados.</p>
  </ng-template>
</div>
