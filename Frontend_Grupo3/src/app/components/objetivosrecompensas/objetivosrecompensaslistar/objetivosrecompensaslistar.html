<div class="container">

    <div class="header-row">
      <h2>
        <mat-icon class="settings-icon">settings</mat-icon>
        Unir Objetivos con Recompensas
      </h2>
      <button mat-button class="add" [routerLink]="['/objetivosrecompensas/news']">
        <mat-icon>add</mat-icon> Registrar objetivos con recompensas
      </button>
    </div>
  
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="fechaObtencion">
        <th mat-header-cell *matHeaderCellDef>Fecha de Obtención</th>
        <td mat-cell *matCellDef="let element">
          {{ element.fechaObtencion | date:'dd/MM/yyyy' }}
        </td>
      </ng-container>
  
      <ng-container matColumnDef="Recompensa">
        <th mat-header-cell *matHeaderCellDef>Recompensa</th>
        <td mat-cell *matCellDef="let element">
          {{ element.idRecompensa.nombreRecompensa }}
        </td>
      </ng-container>
  
      <ng-container matColumnDef="Objetivo">
        <th mat-header-cell *matHeaderCellDef>Objetivo</th>
        <td mat-cell *matCellDef="let element">
          {{ element.idObjetivo.nombreObjetivo }}
        </td>
      </ng-container>
  
      <!-- Columna: Editar -->
      <ng-container matColumnDef="editar">
        <th mat-header-cell *matHeaderCellDef>Editar</th>
        <td mat-cell *matCellDef="let element">
          <button mat-button [routerLink]="['/objetivosrecompensas/edits', element.idObjetivosRecompensas]">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <!-- Columna: Eliminar -->
      <ng-container matColumnDef="eliminar">
        <th mat-header-cell *matHeaderCellDef>Eliminar</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="warn" (click)="eliminar(element.idObjetivosRecompensas)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <!-- Filas de encabezado y contenido -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
