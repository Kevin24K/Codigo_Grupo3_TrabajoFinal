<div class="container">
  <div class="header-row">
    <h2>
      <mat-icon class="music-icon">emoji_events</mat-icon>
      Gestión de Recompensas
    </h2>
    
    <!-- Contenedor para los botones alineados horizontalmente -->
    <div class="button-container">
      <button mat-button class="add" [routerLink]="['/recompensa/news']">
        <mat-icon>add</mat-icon> Registrar recompensa
      </button>
      
      <button mat-button class="right-button" [routerLink]="['/objetivosrecompensas']">
        <mat-icon>settings</mat-icon> Asignar recompensas a objetivos
      </button>
    </div>
  </div>

  <!-- Tabla de recompensas -->
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="idRecompensa">
      <th mat-header-cell *matHeaderCellDef>Codigo</th>
      <td mat-cell *matCellDef="let element">{{ element.idRecompensa }}</td>
    </ng-container>

    <ng-container matColumnDef="nombreRecompensa">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let element">{{ element.nombreRecompensa }}</td>
    </ng-container>

    <ng-container matColumnDef="tipoRecompensa">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let element">{{ element.tipoRecompensa }}</td>
    </ng-container>

    <ng-container matColumnDef="puntosValor">
      <th mat-header-cell *matHeaderCellDef>Puntos</th>
      <td mat-cell *matCellDef="let element">{{ element.puntosValor }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let element">{{ element.descripcion }}</td>
    </ng-container>

    <ng-container matColumnDef="editar">
      <th mat-header-cell *matHeaderCellDef>Editar</th>
      <td mat-cell *matCellDef="let element">
        <button mat-button [routerLink]="['/recompensa/edits', element.idRecompensa]">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="eliminar">
      <th mat-header-cell *matHeaderCellDef>Eliminar</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="warn" (click)="eliminar(element.idRecompensa)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
