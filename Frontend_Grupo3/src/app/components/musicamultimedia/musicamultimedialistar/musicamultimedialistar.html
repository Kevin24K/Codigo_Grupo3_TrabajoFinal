<div class="container">

  <div class="header-row">
    <h2>
      <mat-icon class="music-icon">queue_music</mat-icon>
      Gestión de Músicas Multimedia
    </h2>
    <button mat-button class="add" [routerLink]="['/musicamultimedia/news']">
      <mat-icon>add</mat-icon> Registrar nueva música
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- Columna: Nombre de la música -->
    <ng-container matColumnDef="nombreMusica">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let element">{{ element.nombreMusica }}</td>
    </ng-container>

    <!-- Columna: Link del archivo -->
    <ng-container matColumnDef="linkArchivo">
      <th mat-header-cell *matHeaderCellDef>Link del Archivo</th>
      <td mat-cell *matCellDef="let element">
        <a [href]="element.linkArchivo" target="_blank" class="link-archivo">
          {{ element.linkArchivo }}
        </a>
      </td>
    </ng-container>

    <!-- Columna: Tipo de música -->
    <ng-container matColumnDef="tipoMusica">
      <th mat-header-cell *matHeaderCellDef>Tipo de Música</th>
      <td mat-cell *matCellDef="let element">
        {{ element.idTipoMusica.nombreTipo }}
      </td>
    </ng-container>

    <!-- Columna: Editar -->
    <ng-container matColumnDef="editar">
      <th mat-header-cell *matHeaderCellDef>Editar</th>
      <td mat-cell *matCellDef="let element">
        <button mat-button [routerLink]="['/musicamultimedia/edits', element.idMusicaMultimedia]">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Columna: Eliminar -->
    <ng-container matColumnDef="eliminar">
      <th mat-header-cell *matHeaderCellDef>Eliminar</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="warn" (click)="eliminar(element.idMusicaMultimedia)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Filas de encabezado y contenido -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
